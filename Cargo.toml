[package]
name = "reactive-db"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Typed, synchronous incremental collections and delta subscriptions"
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }

[[bench]]
name = "core"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "scheduler"
harness = false
