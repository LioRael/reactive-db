[package]
name = "reactive-db"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Typed, synchronous incremental collections and delta subscriptions"
license = "MIT"
repository = "https://github.com/LioRael/reactive-db"
documentation = "https://docs.rs/reactive-db"
readme = "README.md"
keywords = ["reactive", "database", "incremental", "query", "collections"]
categories = ["data-structures", "database-implementations"]
include = ["/src/**", "/examples/**", "/tests/**", "/benches/*.rs", "/docs/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/THIRD_PARTY.md", "/CHANGELOG.md"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }

[[bench]]
name = "core"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "scheduler"
harness = false
